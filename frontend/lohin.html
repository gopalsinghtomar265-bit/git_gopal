  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  <button>Login</button>
</form>
  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width,initial-scale=1" />
      <title>Login</title>
      <style>
        :root{--bg:#0f1720;--card:#0b1220;--accent:#e50914;--muted:#9aa4ad}
        html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, sans-serif;background:linear-gradient(180deg,#061021,#0b1220);color:#fff}
        .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
        .card{background:var(--card);padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,.6);width:100%;max-width:420px}
        h1{margin:0 0 8px;font-size:22px}
        p.lead{color:var(--muted);margin:0 0 18px}
        form{display:flex;flex-direction:column;gap:12px}
        input{padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:#fff;font-size:15px}
        button{margin-top:6px;padding:12px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
        .note{font-size:13px;color:var(--muted);margin-top:10px}
        .err{color:#ffb3b3;font-size:13px}
        @media (max-width:480px){.card{padding:20px;margin:12px}}
      </style>
    </head>
    <body>
      <div class="wrap">
        <div class="card">
          <h1>Welcome back</h1>
          <p class="lead">Sign in to continue to your projects.</p>

          <form id="loginForm" autocomplete="off">
            <input id="username" name="username" type="text" placeholder="Username or email" required />
            <input id="password" name="password" type="password" placeholder="Password" required minlength="6" />
            <button type="submit">Login</button>
            <div id="message" class="note"></div>
          </form>
        </div>
      </div>

      <script>
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('message');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          msg.textContent = '';
          const u = document.getElementById('username').value.trim();
          const p = document.getElementById('password').value;
          if(!u){ msg.textContent = 'Please enter your username or email.'; msg.className='err'; return }
          if(p.length < 6){ msg.textContent = 'Password must be at least 6 characters.'; msg.className='err'; return }
          // For local demo only — show a simulated success
          msg.className='note';
          msg.textContent = 'Login successful (demo). Opening dashboard...';
          // simulate redirect
          setTimeout(()=>{
            msg.textContent = 'This is a demo page — no real authentication.';
          },900);
        });
      </script>
    </body>
  </html>
